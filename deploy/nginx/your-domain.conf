# ============================================================
# Nginx 反向代理配置 — 生产部署推荐（放在 /etc/nginx/conf.d/你的域名.conf）
# 替换 "your-domain.com" 为你自己的域名，HTTPS 证书用 Let's Encrypt（certbot）签发
# ============================================================

# ---------------- HTTP -> HTTPS 301 跳转 ----------------
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Let's Encrypt 验证目录（certbot --nginx 自动续期需要）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 所有 HTTP 流量跳转到 HTTPS（保留原 URL 和 Query 参数）
    return 301 https://$host$request_uri;
}

# ---------------- HTTPS 主站（443） ----------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # ==== HTTPS 证书（certbot 会自动填，这里是示例路径）====
    # 签发命令：certbot certonly --nginx -d your-domain.com -d www.your-domain.com
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/your-domain.com/chain.pem;

    # ==== TLS 安全配置（Mozilla 推荐现代配置，A+ 评级）====
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ==== HSTS（浏览器强制 HTTPS，有效期半年）====
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload" always;

    # ==== 基础安全头（防 XSS / 点击劫持）====
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ==== 日志 ====
    access_log /var/log/nginx/bentofolio-access.log;
    error_log  /var/log/nginx/bentofolio-error.log warn;

    # ==== Gzip 压缩（Nginx 原生比 Next.js 内置压缩更快）====
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2
        font/woff;

    # ====================================================
    # Next.js 静态资源 .next/static — 直接 Nginx 读文件 + 强缓存 1 年
    # 这些文件名带 hash，永远不变，可以放心缓存
    # ====================================================
    location /_next/static/ {
        alias /var/www/bentofolio/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
        try_files $uri =404;
    }

    # ====================================================
    # 项目 public 目录静态资源（头像、图片、robots.txt 等）
    # 同样让 Nginx 直接读文件，不经过 Node.js
    # ====================================================
    location / {
        # 先尝试找 public 目录里的静态文件，找不到就反代到 Node.js
        try_files $uri @nextjs;
        root /var/www/bentofolio/public;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ====================================================
    # 反代到 Next.js Node 进程（PM2 跑的 3000 端口）
    # ====================================================
    location @nextjs {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # ==== 真实客户端 IP 和协议 ====
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # ==== WebSocket / SSE 支持（Next.js 热更新/流式渲染用）====
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # ==== 超时配置（避免长任务被 Nginx 掐断）====
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }

    # ==== 文件上传体积限制（当前站没上传功能，留着后续扩展）====
    client_max_body_size 16M;
}
